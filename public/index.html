<!doctype html>

         Dat zorgt dat AFRAME beschikbaar is voordat je componenten registreert. -->
    <style>
        body {
            margin: 0;
            font-family: system-ui, Arial;
            background: #0b1220;
        }

        /* Forceer a-scene fullscreen zodat je de simulatie ziet */
        a-scene {
            width: 100vw;
            height: 100vh;
            display: block;
        }

        /* UI panel: strakke gaming look */
        #panel {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            top: 12px;
            background: linear-gradient(180deg, rgba(20, 20, 30, 0.98), rgba(12, 12, 20, 0.95));
            color: #e6eef8;
            padding: 20px 22px;
            border-radius: 14px;
            box-shadow: 0 10px 60px rgba(0, 0, 0, 0.65);
            z-index: 200;
            max-width: 980px;
            width: calc(100vw - 40px);
            display: none;
            text-align: left;
            border: 1px solid rgba(255, 255, 255, 0.06);
            font-size: 18px;
        }

        #message {
            margin: 14px 0;
            white-space: pre-wrap;
            line-height: 1.4;
            font-size: 18px;
        }

        .btn {
            padding: 14px 20px;
            border-radius: 12px;
            border: 0;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.35);
            font-size: 18px;
            min-width: 160px;
            display: inline-block;
            margin: 6px;
        }

        .btn-ok {
            background: linear-gradient(180deg, #2f80ed, #1b6fd4);
            color: white;
        }

        .btn-bad {
            background: linear-gradient(180deg, #bdc3c7, #95a5a6);
            color: white;
        }

        .btn-neutral {
            background: linear-gradient(180deg, #3a3f4a, #2a2d33);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        /* VR Knop styling */
        #vrButton {
            position: absolute;
            bottom: 20px;
            right: 20px;
            padding: 16px 28px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 8px 32px rgba(102, 126, 234, 0.4);
            z-index: 300;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #vrButton:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(102, 126, 234, 0.6);
        }

        #vrButton:active {
            transform: translateY(0);
        }

        #vrButton.in-vr {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        @media (max-width:600px) {
            #panel {
                top: 8px;
                padding: 14px;
                font-size: 16px;
            }

            .btn {
                font-size: 16px;
                padding: 12px 16px;
                min-width: 120px;
            }

            #vrButton {
                bottom: 10px;
                right: 10px;
                padding: 12px 20px;
                font-size: 16px;
            }
        }

        #phone {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 280px;
            height: 480px;
            background: #222;
            border-radius: 30px;

    <script type="module">
        // Importeer A-Frame als module en verkrijg de globale AFRAME export.
        // Hierdoor is `AFRAME` gegarandeerd beschikbaar in deze module.
        import AFRAME from 'aframe';

        // ===== VR COMPONENTEN =====

        // Thumbstick Locomotion Component (linker controller)
        AFRAME.registerComponent('thumbstick-locomotion', {
            init: function () {
                this.el.addEventListener('thumbstickmoved', (evt) => {
                    const cameraRig = document.getElementById('cameraRig');
                    const camera = document.getElementById('head');

                    if (!cameraRig || !camera) return;

                    // Haal thumbstick waarden op (-1 tot 1)
                    const x = evt.detail.x;  // Links/rechts
                    const y = evt.detail.y;  // Omhoog = vooruit, omlaag = achteruit

                    // Deadzone om drift te voorkomen
                    if (Math.abs(x) < 0.2 && Math.abs(y) < 0.2) return;

                    // Snelheid van beweging (iets sneller voor VR)
                    const speed = 0.08;

                    // Haal camera rotatie voor forward/backward beweging
                    const rotation = camera.getAttribute('rotation');
                    const radians = (rotation.y * Math.PI) / 180;

                    // Bereken beweging gebaseerd op kijkrichting
                    // y > 0 = thumbstick omhoog = vooruit
                    // y < 0 = thumbstick omlaag = achteruit
                    // x > 0 = thumbstick rechts = strafe rechts
                    // x < 0 = thumbstick links = strafe links
                    const deltaX = Math.sin(radians) * y * speed + Math.cos(radians) * x * speed;
                    const deltaZ = Math.cos(radians) * y * speed - Math.sin(radians) * x * speed;

                    // Update positie
                    const currentPos = cameraRig.getAttribute('position');
                    cameraRig.setAttribute('position', {
                        x: currentPos.x + deltaX,
                        y: currentPos.y,
                        z: currentPos.z - deltaZ
                    });
                });
            }
        });

        // VR Interaction Component (rechter controller trigger)
        AFRAME.registerComponent('vr-interactor', {
            init: function () {
                this.raycaster = this.el.components.raycaster;

                this.el.addEventListener('triggerdown', () => {
                    if (!this.raycaster) return;

                    const intersections = this.raycaster.intersections;
                    if (intersections.length > 0) {
                        const targetEl = intersections[0].object.el;

                        // Simuleer click event voor bestaande handlers
                        if (targetEl) {
                            targetEl.emit('click');
                        }
                    }
                });
            }
        });

        const panel = document.getElementById('panel');
        const ui = document.getElementById('ui');
        const message = document.getElementById('message');
        const body = document.getElementById('body');
        const ambulance = document.getElementById('ambulance');
        const triangle = document.getElementById('triangle');
        const car = document.getElementById('car');
        const resetBtn = document.getElementById('reset');
        const person = document.getElementById('person');
        const cameraRig = document.getElementById('cameraRig');
        const phone = document.getElementById('phone');
        const phoneScreen = document.getElementById('phoneScreen');
        const phoneChoices = document.getElementById('phoneChoices');
        const ehbo = document.getElementById('ehbo');
        const wound = document.getElementById('wound');
        const readQ = document.getElementById('readQuestion');
        const lookLeft = document.getElementById('lookLeft');
        const lookRight = document.getElementById('lookRight');
        const towel = document.getElementById('towel');
        const spray = document.getElementById('spray');
        const plaster = document.getElementById('plaster');
        const towelLabel = document.getElementById('towelLabel');
        const sprayLabel = document.getElementById('sprayLabel');
        const plasterLabel = document.getElementById('plasterLabel');
        const medic1 = document.getElementById('medic1');
        const medic2 = document.getElementById('medic2');
        const vrButton = document.getElementById('vrButton');
        const vrButtonText = document.getElementById('vrButtonText');

        let step = 0;
        let crashed = false;
        let carMoving = false;
        let ehboPicked = false;
        let woundDabbed = false;        // Handdoek gebruikt
        let woundDisinfected = false;   // Spray gebruikt
        let plasterApplied = false;     // Pleister gebruikt
        let lookedLeft = false;
        let lookedRight = false;
        let heldItem = null; // 'towel', 'spray' or 'plaster'
        let ambulanceEnRoute = false;
        let ambulanceArriving = false;
        let inVRMode = false;

        // Detecteer VR mode
        const sceneEl = document.querySelector('a-scene');
        sceneEl.addEventListener('enter-vr', () => {
            inVRMode = true;
            vrButton.classList.add('in-vr');
            vrButtonText.textContent = 'Exit VR';
            // Voeg VR interactor component toe aan rechter hand
            const rightHand = document.getElementById('rightHand');
            if (rightHand && !rightHand.hasAttribute('vr-interactor')) {
                rightHand.setAttribute('vr-interactor', '');
            }
        });

        sceneEl.addEventListener('exit-vr', () => {
            inVRMode = false;
            vrButton.classList.remove('in-vr');
            vrButtonText.textContent = 'Start VR';
        });

        // VR Button click handler
        vrButton.addEventListener('click', () => {
            if (!sceneEl) return;

            if (inVRMode) {
                // Exit VR
                sceneEl.exitVR();
            } else {
                // Enter VR
                sceneEl.enterVR().catch(err => {
                    console.error('Kan VR niet starten:', err);
                    alert('VR kon niet gestart worden. Zorg dat je een VR-headset hebt aangesloten of gebruik een VR-compatibele browser.');
                });
            }
        });

        function showPanel(html, options = []) {
            // Check altijd of we in VR mode zijn (voor zekerheid)
            const sceneEl = document.querySelector('a-scene');
            const actuallyInVR = sceneEl && sceneEl.is('vr-mode');
            
            console.log('showPanel called. inVRMode:', inVRMode, 'actuallyInVR:', actuallyInVR);
            
            if (actuallyInVR || inVRMode) {
                // VR mode: creëer 3D panel in de wereld
                console.log('Creating VR panel');
                createVRPanel(html, options);
            } else {
                // Desktop mode: gebruik 2D overlay
                console.log('Creating 2D panel');
                message.innerHTML = html;
                ui.innerHTML = '';
                options.forEach(opt => {
                    const btn = document.createElement('button');
                    btn.textContent = opt.text;
                    btn.className = 'btn ' + (opt.good ? 'btn-ok' : 'btn-bad');
                    btn.onclick = opt.action;
                    ui.appendChild(btn);
                });
                panel.style.display = 'block';
            }
        }

        // Creëer 3D panel voor VR
        function createVRPanel(html, options = []) {
            const scene = document.querySelector('a-scene');
            const head = document.getElementById('head');

            // Verwijder oude VR panel als die bestaat
            const oldPanel = document.getElementById('vrPanel');
            if (oldPanel) oldPanel.parentNode.removeChild(oldPanel);

            const vrPanel = document.createElement('a-entity');
            vrPanel.setAttribute('id', 'vrPanel');
            
            // Hang het panel aan de camera (head) zodat het altijd in beeld is
            // en 1.8 meter voor de gebruiker zweeft op ooghoogte
            vrPanel.setAttribute('position', '0 0 -1.8');
            vrPanel.setAttribute('rotation', '0 0 0');

            // Background plane
            const bg = document.createElement('a-plane');
            bg.setAttribute('width', '3');
            bg.setAttribute('height', '2');
            bg.setAttribute('color', '#1a1a2e');
            bg.setAttribute('opacity', '0.95');
            bg.setAttribute('material', 'side: double');
            vrPanel.appendChild(bg);

            // Strip HTML tags voor text display
            const textOnly = html.replace(/<[^>]*>/g, '\n').replace(/\s+/g, ' ').trim();

            // Message text
            const messageText = document.createElement('a-text');
            messageText.setAttribute('value', textOnly.substring(0, 300));
            messageText.setAttribute('align', 'center');
            messageText.setAttribute('baseline', 'top');
            messageText.setAttribute('color', '#ffffff');
            messageText.setAttribute('position', '0 0.7 0.02');
            messageText.setAttribute('width', '2.6');
            messageText.setAttribute('wrap-count', '45');
            messageText.setAttribute('line-height', '55');
            vrPanel.appendChild(messageText);

            // Buttons - groter en duidelijker
            const buttonSpacing = 0.8;
            const startY = -0.5;
            const buttonsPerRow = 2;

            options.forEach((opt, index) => {
                const row = Math.floor(index / buttonsPerRow);
                const col = index % buttonsPerRow;
                const xPos = (col - (buttonsPerRow - 1) / 2) * buttonSpacing;
                const yPos = startY - row * 0.3;

                const btn = document.createElement('a-box');
                btn.setAttribute('class', 'interactable phone-btn-vr');
                btn.setAttribute('width', '0.7');
                btn.setAttribute('height', '0.25');
                btn.setAttribute('depth', '0.08');
                btn.setAttribute('color', opt.good ? '#2f80ed' : '#95a5a6');
                btn.setAttribute('position', `${xPos} ${yPos} 0.02`);

                const btnText = document.createElement('a-text');
                btnText.setAttribute('value', opt.text.substring(0, 20));
                btnText.setAttribute('align', 'center');
                btnText.setAttribute('baseline', 'center');
                btnText.setAttribute('color', '#ffffff');
                btnText.setAttribute('position', '0 0 0.05');
                btnText.setAttribute('width', '1');
                btn.appendChild(btnText);

                btn.addEventListener('click', () => {
                    console.log('VR Panel button clicked:', opt.text);
                    // Verwijder panel
                    if (vrPanel.parentNode) vrPanel.parentNode.removeChild(vrPanel);
                    // Execute action
                    if (opt.action) opt.action();
                });

                // Hover effect
                btn.addEventListener('raycaster-intersected', () => {
                    btn.setAttribute('scale', '1.15 1.15 1.15');
                });
                btn.addEventListener('raycaster-intersected-cleared', () => {
                    btn.setAttribute('scale', '1 1 1');
                });

                vrPanel.appendChild(btn);
            });

            console.log('VR Panel created and appending to scene');
            // Voeg toe als child van de camera zodat het meebeweegt
            if (head) {
                head.appendChild(vrPanel);
            } else {
                // fallback: voeg toe aan de scene (minder ideaal)
                scene.appendChild(vrPanel);
            }
        }

        function showFeedback(text, isGood, next) {
            if (inVRMode) {
                // VR mode: 3D feedback
                createVRPanel(text, [
                    {
                        text: isGood ? 'Verder' : 'Opnieuw',
                        good: isGood,
                        action: () => {
                            if (isGood && typeof next === 'function') next();
                            if (!isGood) reset();
                        }
                    }
                ]);
            } else {
                // Desktop mode
                message.innerHTML = text;
                ui.innerHTML = '';
                const btn = document.createElement('button');
                btn.textContent = isGood ? 'Verder' : 'Opnieuw proberen';
                btn.className = 'btn ' + (isGood ? 'btn-ok' : 'btn-bad');
                btn.onclick = () => {
                    panel.style.display = 'none';
                    if (isGood && typeof next === 'function') next();
                    if (!isGood) reset();
                };
                ui.appendChild(btn);
                panel.style.display = 'block';
            }
        }

        // vraag-interface zonder hints vooraf
        function showQuestion(html, choices = []) {
            if (inVRMode) {
                // VR mode: 3D vraag interface
                createVRQuestionPanel(html, choices);
            } else {
                // Desktop mode
                message.innerHTML = html;
                ui.innerHTML = '';
                choices.forEach(choice => {
                    const btn = document.createElement('button');
                    btn.textContent = choice.text;
                    btn.className = 'btn btn-neutral';
                    btn.onclick = () => evaluateAnswer(choice);
                    ui.appendChild(btn);
                });
                panel.style.display = 'block';
            }
        }

        // VR Question Panel
        function createVRQuestionPanel(html, choices = []) {
            const scene = document.querySelector('a-scene');

            const oldPanel = document.getElementById('vrPanel');
            if (oldPanel) oldPanel.parentNode.removeChild(oldPanel);

            const vrPanel = document.createElement('a-entity');
            vrPanel.setAttribute('id', 'vrPanel');
            vrPanel.setAttribute('position', '0 1.6 4.5');

            // Background
            const bg = document.createElement('a-plane');
            bg.setAttribute('width', '2.2');
            bg.setAttribute('height', '1.5');
            bg.setAttribute('color', '#1a1a2e');
            bg.setAttribute('opacity', '0.95');
            vrPanel.appendChild(bg);

            // Strip HTML tags
            const textOnly = html.replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim();

            // Question text
            const questionText = document.createElement('a-text');
            questionText.setAttribute('value', textOnly.substring(0, 250));
            questionText.setAttribute('align', 'center');
            questionText.setAttribute('color', '#fff');
            questionText.setAttribute('position', '0 0.5 0.01');
            questionText.setAttribute('width', '2');
            questionText.setAttribute('wrap-count', '40');
            vrPanel.appendChild(questionText);

            // Choice buttons
            const startY = 0.1;
            choices.forEach((choice, index) => {
                const yPos = startY - index * 0.28;

                const btn = document.createElement('a-box');
                btn.setAttribute('class', 'interactable phone-btn-vr');
                btn.setAttribute('width', '1.9');
                btn.setAttribute('height', '0.22');
                btn.setAttribute('depth', '0.05');
                btn.setAttribute('color', '#3a3f4a');
                btn.setAttribute('position', `0 ${yPos} 0.01`);

                const btnText = document.createElement('a-text');
                btnText.setAttribute('value', choice.text.substring(0, 50));
                btnText.setAttribute('align', 'center');
                btnText.setAttribute('color', '#fff');
                btnText.setAttribute('position', '0 0 0.03');
                btnText.setAttribute('width', '2.5');
                btn.appendChild(btnText);

                btn.addEventListener('click', () => {
                    if (vrPanel.parentNode) vrPanel.parentNode.removeChild(vrPanel);
                    evaluateAnswer(choice);
                });

                // Hover effect
                btn.addEventListener('raycaster-intersected', () => {
                    btn.setAttribute('color', choice.correct ? '#27ae60' : '#e67e22');
                    btn.setAttribute('scale', '1.05 1.05 1.05');
                });
                btn.addEventListener('raycaster-intersected-cleared', () => {
                    btn.setAttribute('color', '#3a3f4a');
                    btn.setAttribute('scale', '1 1 1');
                });

                vrPanel.appendChild(btn);
            });

            scene.appendChild(vrPanel);
        }

        function evaluateAnswer(choice) {
            // Verberg beide panels (2D en 3D)
            panel.style.display = 'none';
            const vrPanel = document.getElementById('vrPanel');
            if (vrPanel && vrPanel.parentNode) vrPanel.parentNode.removeChild(vrPanel);

            if (choice.correct) {
                showFeedback('✅ ' + (choice.feedback || 'Goed gedaan.'), true, () => {
                    if (typeof choice.next === 'function') choice.next();
                });
            } else {
                // toon korte uitleg waarom het niet goed is, maar reveal geen hint vóór kiezen
                showFeedback('❌ ' + (choice.feedback || 'Dit is niet de beste keuze.'), false, () => {
                    // on wrong: ga niet automatisch verder — laat gebruiker opnieuw kiezen of herstart
                    if (choice.retry === true) {
                        panel.style.display = 'none';
                        // open same question again if provided
                        if (typeof choice.repeat === 'function') choice.repeat();
                    } else if (typeof choice.next === 'function') {
                        choice.next();
                    }
                });
            }
        }

        // start crash: auto rijdt van andere kant (z negatief) naar het slachtoffer (richting +z)
        function startCrash() {
            carMoving = true;
            // ensure car faces +z (rotation 0 0 0) and komt van z = -25
            car.setAttribute('rotation', '0 0 0');
            const from = car.getAttribute('position');
            const fromStr = `${from.x} ${from.y} ${from.z}`;
            // eindigt iets vóór het slachtoffer (niet eroverheen), net voor z ≈ 0
            car.setAttribute('animation__drive', `property: position; from: ${fromStr}; to: 0 0 -0.6; dur: 3800; easing: linear`);
        }

        // Komponenten voor interactiviteit (aangepast voor VR triggers)
        AFRAME.registerComponent('gaze-trigger', {
            schema: { id: { type: 'string' } },
            init: function () {
                const el = this.el;
                
                const handleInteraction = () => {
                    // Alleen actief in stap 1
                    if (step !== 1) return;

                    const id = this.data.id;
                    if (id === 'left') {
                        lookedLeft = true;
                        el.setAttribute('color', '#9ae6b4');
                        el.setAttribute('scale', '1.3 1.3 1.3');
                    } else {
                        lookedRight = true;
                        el.setAttribute('color', '#9ae6b4');
                        el.setAttribute('scale', '1.3 1.3 1.3');
                    }
                    // als beide bekeken: verberg balletjes en ga verder naar stap 2
                    if (lookedLeft && lookedRight) {
                        lookLeft.setAttribute('visible', false);
                        lookRight.setAttribute('visible', false);
                        document.getElementById('lookHint').setAttribute('visible', false);
                        nextStep();
                    }
                };

                // Click event voor trigger
                el.addEventListener('click', handleInteraction);
                
                // Hover effecten voor visuele feedback
                el.addEventListener('raycaster-intersected', (evt) => {
                    if (step === 1) {
                        const id = this.data.id;
                        // Alleen groter maken als nog niet geactiveerd
                        if ((id === 'left' && !lookedLeft) || (id === 'right' && !lookedRight)) {
                            el.setAttribute('scale', '1.15 1.15 1.15');
                        }
                    }
                });
                
                el.addEventListener('raycaster-intersected-cleared', (evt) => {
                    if (step === 1) {
                        const id = this.data.id;
                        // Reset scale als nog niet geactiveerd
                        if ((id === 'left' && !lookedLeft) || (id === 'right' && !lookedRight)) {
                            el.setAttribute('scale', '1 1 1');
                        }
                    }
                });
            }
        });

        // Glow-component voor interactables
        AFRAME.registerComponent('glow', {
            schema: { active: { type: 'boolean', default: false } },
            init: function () {
                this.animId = null;
            },
            update: function () {
                if (this.data.active) {
                    // pulse scale & color
                    this.el.setAttribute('animation__pulse', 'property: scale; dir: alternate; dur: 800; to: 1.12 1.12 1.12; loop: true');
                    this.el.setAttribute('animation__color', 'property: color; dir: alternate; dur: 800; to: #ffffff; loop: true');
                } else {
                    this.el.removeAttribute('animation__pulse');
                    this.el.removeAttribute('animation__color');
                    this.el.setAttribute('scale', '1 1 1');
                }
            }
        });

        // Pick-up / hold met VR controller triggers
        AFRAME.registerComponent('pickable', {
            init: function () {
                const el = this.el;
                function tryPickup() {
                    // only allow pickup when items zijn usable (EHBO stage)
                    if (step >= 4 && !heldItem && el.getAttribute('visible') === true) {
                        heldItem = el.getAttribute('id');

                        // In VR: attach to rechter controller, anders aan camera
                        const attachTo = inVRMode ?
                            document.getElementById('rightHand') :
                            document.querySelector('[camera]');

                        if (!attachTo) return;

                        try {
                            // Remove from current parent
                            if (el.object3D && el.object3D.parent) {
                                el.object3D.parent.remove(el.object3D);
                            }

                            // Attach to controller/camera
                            attachTo.appendChild(el);

                            if (inVRMode) {
                                // Positie ten opzichte van rechter controller
                                el.setAttribute('position', '0 0.1 -0.15');
                                el.setAttribute('rotation', '0 0 0');
                                el.setAttribute('scale', '0.7 0.7 0.7');
                            } else {
                                // Desktop mode positie
                                el.setAttribute('position', '0 -0.12 -0.6');
                                el.setAttribute('rotation', '0 0 0');
                                el.setAttribute('scale', '0.9 0.9 0.9');
                            }

                            const itemName = heldItem === 'towel' ? 'handdoek' : (heldItem === 'spray' ? 'spraybus' : 'pleister');
                            showFeedback('Je hebt de ' + itemName + ' gepakt. Gebruik het op het slachtoffer.', true, () => { });
                            // disable glow while held
                            el.components['glow'] && el.setAttribute('glow', { active: false });
                        } catch (e) {
                            console.error('Cannot pick up element', e);
                        }
                    }
                }

                // support mouse/touch, A-Frame click events en VR triggers
                el.addEventListener('click', tryPickup);
                el.addEventListener('mousedown', tryPickup);
                el.addEventListener('touchstart', tryPickup);

                // Hover effect in VR
                el.addEventListener('raycaster-intersected', (evt) => {
                    if (step >= 4 && !heldItem) {
                        el.setAttribute('scale', '1.15 1.15 1.15');
                    }
                });
                el.addEventListener('raycaster-intersected-cleared', (evt) => {
                    if (!heldItem) {
                        el.setAttribute('scale', '1 1 1');
                    }
                });
            }
        });

        // klik op slachtoffer om gebruikt item toe te passen (negeer klikken vóór EHBO-stap / geen 'niets vast' melding)
        person.addEventListener('click', () => {
            if (step < 4) return; // stil genegeerd zolang EHBO nog niet beschikbaar is
            if (!heldItem) return; // geen feedback tonen wanneer niets vast

            // Volgorde: 1. Handdoek (deppen) -> 2. Spray (desinfecteren) -> 3. Pleister
            if (heldItem === 'towel') {
                if (!woundDabbed) {
                    wound.setAttribute('color', '#c77979'); // Iets schoner
                    woundDabbed = true;
                    dropItem('towel', { x: -0.2, y: 0.04, z: 1.4 });
                    heldItem = null;
                    showFeedback('✅ Wond gedept met de handdoek.', true, () => {
                        updateGlows();
                    });
                } else {
                    showFeedback('De wond is al gedept.', true, () => { });
                }
            } else if (heldItem === 'spray') {
                if (!woundDabbed) {
                    showFeedback('❌ Eerst deppen! Gebruik eerst de handdoek om de wond schoon te deppen.', false);
                    return;
                }
                if (!woundDisinfected) {
                    wound.setAttribute('color', '#e67e22'); // Gedesinfecteerd
                    woundDisinfected = true;
                    dropItem('spray', { x: 0.4, y: 0.2, z: 1.4 });
                    heldItem = null;
                    showFeedback('✅ Wond gedesinfecteerd met spray.', true, () => {
                        updateGlows();
                    });
                } else {
                    showFeedback('De wond is al gedesinfecteerd.', true, () => { });
                }
            } else if (heldItem === 'plaster') {
                if (!woundDabbed) {
                    showFeedback('❌ Eerst de wond deppen met de handdoek!', false);
                    return;
                }
                if (!woundDisinfected) {
                    showFeedback('❌ Eerst desinfecteren! Gebruik eerst de spray na het deppen.', false);
                    return;
                }
                if (!plasterApplied) {
                    wound.setAttribute('visible', false);
                    plasterApplied = true;
                    dropItem('plaster', { x: 1.2, y: 0.04, z: 1.4 });
                    heldItem = null;
                    showFeedback('✅ Pleister aangebracht. De ambulance zal nu volledig arriveren.', true, () => {
                        // stop glow
                        plaster.setAttribute('glow', { active: false });
                        towel.setAttribute('glow', { active: false });
                        spray.setAttribute('glow', { active: false });
                        // verplaats EHBO-kist terug
                        ehbo.setAttribute('animation__close', 'property: position; to: 0.8 0 1.2; dur: 800; easing: easeInQuad');
                        setTimeout(() => {
                            ehbo.setAttribute('visible', false);
                            ehbo.removeAttribute('animation__close');
                            // trigger ambulance arrival (medics stappen uit en nemen de persoon mee)
                            triggerAmbulanceArrival();
                            // ga door naar de volgende stap (ambulance / vervolg)
                            setTimeout(() => nextStep(), 50);
                        }, 900);
                    });
                } else {
                    showFeedback('Pleister al aangebracht.', true);
                }
            }
        });

        function dropItem(id, pos) {
            const item = document.getElementById(id);
            // ensure item exists and reparent to scene
            const scene = document.querySelector('a-scene');
            item.setAttribute('position', `${pos.x} ${pos.y} ${pos.z}`);
            item.setAttribute('rotation', '0 0 0');
            item.setAttribute('scale', '1 1 1');
            scene.appendChild(item);
            // allow pickup again
            item.components['glow'] && item.setAttribute('glow', { active: false });
        }

        function updateGlows() {
            // items glow only when EHBO stage active and ambulance is en route
            const activeBase = (step >= 4 && ambulanceEnRoute);

            // Volgorde: handdoek -> spray -> pleister
            towel.setAttribute('glow', { active: (activeBase && !woundDabbed) });
            spray.setAttribute('glow', { active: (activeBase && woundDabbed && !woundDisinfected) });
            plaster.setAttribute('glow', { active: (activeBase && woundDabbed && woundDisinfected && !plasterApplied) });

            // highlight wound location in a distinct pulsing color while treatable
            const woundActive = (step >= 4 && ambulanceEnRoute && !woundDabbed);
            if (woundActive) {
                // pulse scale + color to draw attention
                wound.setAttribute('animation__pulse', 'property: scale; dir: alternate; dur: 700; to: 1.35 1.35 1.35; loop: true');
                wound.setAttribute('animation__color', 'property: color; dir: alternate; dur: 700; to: #ff6b6b; loop: true');
            } else {
                wound.removeAttribute('animation__pulse');
                wound.removeAttribute('animation__color');
                wound.setAttribute('scale', '1 1 1');
                wound.setAttribute('color', '#c0392b');
            }
        }

        // collision-check component: eenvoudige afstandscheck (werkt ongeacht zijde van benadering)
        AFRAME.registerComponent('collision-check', {
            tick: function () {
                if (!carMoving) return;
                const carPos = car.getAttribute('position');
                const personPos = person.getAttribute('position');
                const dx = carPos.x - personPos.x;
                const dz = carPos.z - personPos.z;
                const distance = Math.sqrt(dx * dx + dz * dz);
                // trigger botsing als dicht genoeg (ongeacht richting) en nog niet gebeurd
                if (distance < 1.2 && !crashed) {
                    crashed = true;
                    car.removeAttribute('animation__drive');
                    car.setAttribute('position', carPos);
                    carMoving = false;
                    // laat het slachtoffer vallen (rotatie + schuiven)
                    person.setAttribute('animation__fallrot', 'property: rotation; to: 90 0 -90; dur: 700; easing: easeOutQuad');
                    person.setAttribute('animation__fallpos', 'property: position; to: 0 0.15 -0.4; dur: 700; easing: easeOutQuad');
                    body.setAttribute('color', '#7f8c8d');
                    setTimeout(() => nextStep(), 1000);
                }
            }
        });

        function nextStep() {
            step++;
            // Zorg dat de 'Lees vraag' knop altijd de huidige vraag toont

                                lookRight.setAttribute('visible', true);
                                lookLeft.setAttribute('gaze-trigger', { id: 'left' });
                                lookRight.setAttribute('gaze-trigger', { id: 'right' });
                            }

            else if (step === 2) {

                showQuestion(

                            }
                        },
                        { text: 'B. Je schudt de persoon stevig aan de schouders', correct: false, feedback: 'Schudden kan gevaarlijk zijn; probeer eerst verbaal contact.' },
                        { text: 'C. Je roept in paniek om hulp', correct: false, feedback: 'Paniek helpt niet; blijf rustig en controleer aanspreekbaarheid.' }
                    ]
                );
            }
            else if (step === 3) {
                showQuestion(

                    [
                        { text: 'A. Je belt 112 en vertelt wat er is gebeurd', correct: true, feedback: 'Juist — bel 112 en geef locatie en aantal gewonden door.', next: () => openPhone() },
                        { text: 'B. Je wacht even of hij zelf opstaat', correct: false, feedback: 'Wachten kost waardevolle tijd; bel altijd bij mogelijk ernstig letsel.' },
                        { text: 'C. Je zoekt iemand anders die misschien wil bellen', correct: false, feedback: 'Je kunt iemand vragen, maar jij bent aanwezig — bel direct.' }

            }
            else if (step === 4) {
                // EHBO stap: items zichtbaar nadat 112 is gestart (en ambulance en route)
                showPanel(

                    'Situatie:\nEr ligt een EHBO-doos naast het slachtoffer met een handdoek, spraybus en pleister. Klik op de spullen om ze te pakken en behandel de wond in de juiste volgorde terwijl de hulp onderweg is.<br><br>' +
                    'Volgorde: 1. Handdoek (deppen) → 2. Spray (desinfecteren) → 3. Pleister',
                    [
                        {
                            text: 'Ga naar de EHBO spullen', good: true, action: () => {
                                panel.style.display = 'none';
                                const vrPanel = document.getElementById('vrPanel');
                                if (vrPanel && vrPanel.parentNode) vrPanel.parentNode.removeChild(vrPanel);
                                // zet EHBO-kist en items zichtbaar bij slachtoffer
                                ehbo.setAttribute('visible', true);
                                towel.setAttribute('visible', true);
                                spray.setAttribute('visible', true);
                                plaster.setAttribute('visible', true);
                                towelLabel.setAttribute('visible', true);
                                sprayLabel.setAttribute('visible', true);
                                plasterLabel.setAttribute('visible', true);
                                // maak items nu pas interactief en zet glow-standaard
                                towel.setAttribute('pickable', '');
                                spray.setAttribute('pickable', '');
                                plaster.setAttribute('pickable', '');
                                towel.setAttribute('glow', { active: false });
                                spray.setAttribute('glow', { active: false });
                                plaster.setAttribute('glow', { active: false });
                                // pickable-component aanwezig; glow activeert zodra ambulanceEnRoute true
                                updateGlows();
                            }
                        },
                        {
                            text: 'Wachten op ambulance', good: false, action: () => {
                                gameOver('Wachten kost tijd. Kleine handelingen zoals desinfecteren kunnen wél levensreddend zijn.');
                            }
                        }
                    ]
                );
            }
            else if (step === 5) {
                // ambulance is onderweg (maar full arrival waits until pleister)
                showPanel(
                    '<strong>🚑 Ambulance onderweg</strong><br><br>' +
                    'De ambulance is onderweg. Je hebt nu tijd om de wond te behandelen: pak de spray en daarna de pleister.',
                    [
                        {
                            text: 'Ik ga behandelen', good: true, action: () => {
                                panel.style.display = 'none';
                                // laat items gloeien (beschikbaar) als ambulanceEnRoute true
                                updateGlows();
                            }
                        },
                        {
                            text: 'Ik blijf alleen bij slachtoffer', good: false, action: () => {
                                showFeedback('❌ Niet optimaal. Gebruik beschikbare middelen om tijdelijke zorg te bieden terwijl je wacht.', false);
                            }
                        }
                    ]
                );
            }
            else if (step === 6) {
                showPanel(
                    '<strong>❤️ Stap 6 – Blijf bij het slachtoffer</strong><br><br>' +
                    'De hulpverleners zijn ter plaatse. Blijf bij het slachtoffer en geef duidelijk informatie aan hulpdiensten bij aankomst.',
                    [
                        {
                            text: 'A. Je blijft erbij en praat rustig tot de hulpdiensten er zijn', good: true, action: () => {
                                showFeedback('✅ Goed!<br>Blijf bij het slachtoffer, stel hem gerust en wacht op de hulpdiensten.', true, () => win());
                            }
                        },
                        {
                            text: 'B. Je loopt de ambulance tegemoet en laat hem even alleen', good: false, action: () => {
                                gameOver('Laat iemand nooit alleen of bewegen als hij gewond is.');
                            }
                        }
                    ]);
            }
        }

        function showEhboActions() {
            showPanel(
                '<strong>✋ Behandel de wond</strong><br><br>' +
                'Gebruik de spray eerst, daarna pleister.',
                [
                    {
                        text: 'Desinfecteer wond', good: true, action: () => {
                            if (!ehboPicked) { showFeedback('❌ Je hebt nog geen EHBO-kist gepakt.', false); return; }
                            if (woundDisinfected) { showFeedback('✅ Al gedesinfecteerd.', true, () => showEhboActions()); return; }
                            wound.setAttribute('color', '#e67e22');
                            woundDisinfected = true;
                            showFeedback('✅ Wond gedesinfecteerd.', true, () => showEhboActions());
                        }
                    },
                    {
                        text: 'Pleister aanbrengen', good: true, action: () => {
                            if (!ehboPicked) { showFeedback('❌ Je hebt nog geen EHBO-kist gepakt.', false); return; }
                            if (!woundDisinfected) { showFeedback('❌ Eerst desinfecteren, daarna pleisteren.', false); return; }
                            if (plasterApplied) { showFeedback('✅ Pleister al aangebracht.', true, () => showEhboActions()); return; }
                            wound.setAttribute('visible', false);
                            plasterApplied = true;
                            showFeedback('✅ Pleister aangebracht. De wond is tijdelijk verzorgd.', true, () => {
                                ehbo.setAttribute('animation__close', 'property: position; to: 0.8 0 1.2; dur: 800; easing: easeInQuad');

                    }
                ]

        }

        // Start ambulance 'en route' — nadert, maar arriveert pas volledig na pleister
        function startAmbulanceRun() {
            ambulanceEnRoute = true;
            ambulance.setAttribute('visible', true);
            ehbo.setAttribute('visible', true);
            // Laat ambulance naar tussenpositie komen (zichtbaar naderend)
            ambulance.setAttribute('animation__toward', 'property: position; from: 0 0 25; to: 0 0 12; dur: 9000; easing: linear');
            sprayLabel.setAttribute('visible', true);
            plasterLabel.setAttribute('visible', true);
            updateGlows();
        }

        // Wanneer pleister is geplaatst: laat ambulance volledig arriveren en start medics-sequentie
        function triggerAmbulanceArrival() {
            if (!ambulanceEnRoute || ambulanceArriving) return;
            ambulanceArriving = true;
            // stop tussen-animatie en rij naar finale positie
            ambulance.removeAttribute('animation__toward');
            const current = ambulance.getAttribute('position');
            const fromStr = `${current.x} ${current.y} ${current.z}`;
            ambulance.setAttribute('animation__arrive', `property: position; from: ${fromStr}; to: 0 0 3; dur: 7000; easing: linear`);
            // Zorg dat medics-sequentie start na aankomst
            setTimeout(() => {
                ambulance.removeAttribute('animation__arrive');
                ambulance.setAttribute('position', '0 0 3');
                ambulanceArrivedSequence();
            }, 7200);
        }

        function ambulanceArrivedSequence() {
            // medics stap naar slachtoffer
            medic1.setAttribute('visible', true);
            medic2.setAttribute('visible', true);
            // animate medics to positions near person
            medic1.setAttribute('animation__walk', 'property: position; to: 0.6 0 0.6; dur: 1600; easing: easeInOutQuad');
            medic2.setAttribute('animation__walk', 'property: position; to: -0.6 0 0.6; dur: 1600; easing: easeInOutQuad');
            setTimeout(() => {
                medic1.removeAttribute('animation__walk');
                medic2.removeAttribute('animation__walk');
                // simulate taking the person: move person slightly and then back to ambulance
                person.setAttribute('animation__lift', 'property: position; to: 0 0 0.6; dur: 600; easing: easeOutQuad');
                setTimeout(() => {
                    person.removeAttribute('animation__lift');
                    // medics carry person back to ambulance
                    medic1.setAttribute('animation__carry', 'property: position; to: 0.6 0 3; dur: 2000; easing: linear');
                    medic2.setAttribute('animation__carry', 'property: position; to: -0.6 0 3; dur: 2000; easing: linear');
                    person.setAttribute('animation__tow', 'property: position; to: 0 0 3; dur: 2000; easing: linear');
                    setTimeout(() => {
                        // hide person (in ambulance) and medics after loading
                        person.setAttribute('visible', false);
                        medic1.setAttribute('visible', false);
                        medic2.setAttribute('visible', false);
                        medic1.removeAttribute('animation__carry');
                        medic2.removeAttribute('animation__carry');
                        person.removeAttribute('animation__tow');
                        // ambulance rijdt weg
                        ambulance.setAttribute('animation__away', 'property: position; to: 0 0 40; dur: 4000; easing: linear');
                        setTimeout(() => {
                            // einde van sequentie -> volgende stap (afsluitende fase)
                            nextStep();
                        }, 4000);
                    }, 2100);
                }, 700);
            }, 1700);
        }

                    if (!debugText) {
                        debugText = document.createElement('a-text');
                        debugText.setAttribute('id', 'debugText');
                        debugText.setAttribute('position', '0 -0.35 -0.9');
                        debugText.setAttribute('align', 'center');
                        debugText.setAttribute('color', '#0ff');
                        debugText.setAttribute('width', '1.8');
                        head.appendChild(debugText);
                    }
                    const rightHand = document.getElementById('rightHand');
                    const updateDebug = (extra = '') => {
                        const txt = `step=${step} ${extra}`;
                        debugText.setAttribute('value', txt);
                    };
                    updateDebug();
                    if (rightHand) {
                        rightHand.addEventListener('raycaster-intersection', (e) => {
                            const els = (e.detail && e.detail.els) ? e.detail.els : [];
                            const label = els.length ? (els[0].getAttribute('id') || els[0].getAttribute('class') || els[0].tagName) : 'none';
                            updateDebug(`hit=${label}`);
                        });
                        rightHand.addEventListener('raycaster-intersection-cleared', () => {
                            updateDebug('hit=none');
                        });
                        rightHand.addEventListener('click', (e) => {
                            updateDebug('clicked');
                        });
                        rightHand.addEventListener('triggerdown', () => updateDebug('triggerdown'));
                        rightHand.addEventListener('triggerup', () => updateDebug('triggerup'));
                    }
                }
            }
        } catch (e) { /* ignore debug errors */ }

        resetBtn.onclick = reset;

        // initialisatie: voeg componenten toe aan gaze targets (items worden pas interactief in stap 4)
        lookLeft.setAttribute('gaze-trigger', { id: 'left' });
        lookRight.setAttribute('gaze-trigger', { id: 'right' });
        // spray/plaster blijven onzichtbaar en niet-pickable tot stap 4
        // begin
        reset();
    </script>
</body>

</html>
